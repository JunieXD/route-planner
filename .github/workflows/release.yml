name: Package Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build skill archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/package_skill.py "dist/route-planner-${TAG}.zip"
          cd dist
          sha256sum "route-planner-${TAG}.zip" > "route-planner-${TAG}.zip.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" \
            "dist/route-planner-${TAG}.zip" \
            "dist/route-planner-${TAG}.zip.sha256" \
            --clobber
