name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build installable skill archive
        run: python .github/scripts/package_skill.py /tmp/route-planner.zip
      - name: Check command interfaces
        run: |
          python scripts/rail_12306.py --help
          python scripts/rail_12306.py transfer --help
          python scripts/shanghai_metro.py --help
          python scripts/amap_transit.py --help
          python scripts/amap_transit.py walk --help
          python scripts/amap_credentials.py --help
          python scripts/rank_routes.py --help
